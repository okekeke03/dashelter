# C. 自動テスト: main への push とプルリクエストのたびに、全部のテストを実行する
name: テスト

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 読み取りだけ(リポジトリを書き換えない)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # アクションはバージョンのタグではなくコミット ID で固定する(タグを書き換えられても影響を受けない)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: 判定ルール・AI の検証・画面まわり(Node.js)
        run: npm test

      - name: データ整形(Python)
        run: python -I -m unittest discover -s scripts
